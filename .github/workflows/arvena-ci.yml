name: ARVENA Final Verification

on:
  push:
    branches: [arvena-final-green]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ARVENA_FINAL_VERIFICATION
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      ARVENA_CRON_SECRET: test-cron-secret
      ARVENA_EXPORT_BUCKET: arvena-private
      ARVENA_MEDIA_BUCKET: arvena-private
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Baseline source test
        run: npx vitest run tests/unit/repository-baseline.test.ts --reporter=verbose
      - name: Application surface test
        run: npx vitest run tests/integration/application-surface.test.ts --reporter=verbose
      - name: Offline source test
        run: npx vitest run tests/offline/offline-contract.test.ts --reporter=verbose
      - name: Import export source test
        run: npx vitest run tests/import-export/import-export-source.test.ts --reporter=verbose
      - name: Finance source test
        run: npx vitest run tests/finance/money-source.test.ts --reporter=verbose
      - name: Recurring source test
        run: npx vitest run tests/recurring/recurrence-source.test.ts --reporter=verbose
      - name: Unit and source tests gate
        run: npm run test
      - name: Production build
        run: npm run build
