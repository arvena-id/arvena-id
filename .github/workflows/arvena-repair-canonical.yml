name: ARVENA Canonical Migration Repair

on:
  push:
    branches: [arvena-final-green]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arvena-final-green
          fetch-depth: 0

      - name: Repair proven PostgreSQL clean-install defect
        run: |
          FILE='ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql')
          s = p.read_text()
          old = 'unique(id), unique(id,id)'
          if old not in s:
              raise SystemExit('expected defect signature not found; refusing broad rewrite')
          s2 = s.replace(old, 'unique(id)', 1)
          if s2.count('unique(id,id)') != 0:
              raise SystemExit('duplicate-column unique constraint remains')
          p.write_text(s2)
          PY
          git diff --check
          sha256sum "$FILE"

      - name: Commit canonical repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql
          git commit -m 'fix(db): repair duplicate-column unique constraint in canonical baseline'
          git push origin HEAD:arvena-final-green
