name: ARVENA Fixture Repair

on:
  push:
    branches: [arvena-final-green]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arvena-final-green
          fetch-depth: 0

      - name: Repair quote fixture lifecycle ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ARVENA_FINAL_VERIFICATION/tests/db/fixtures.sql')
          s=p.read_text()
          old_a="'a1000004-0000-0000-0000-000000000001','ISSUED','IDR',0,100000,0,0,100000,now()+interval '14 days',now(),'{}','{}','v1')"
          new_a="'a1000004-0000-0000-0000-000000000001','DRAFT','IDR',0,100000,0,0,100000,now()+interval '14 days',null,'{}','{}','v1')"
          old_b="'b1000004-0000-0000-0000-000000000001','ISSUED','USD',2,10000,0,0,10000,now()+interval '14 days',now(),'{}','{}','v1')"
          new_b="'b1000004-0000-0000-0000-000000000001','DRAFT','USD',2,10000,0,0,10000,now()+interval '14 days',null,'{}','{}','v1')"
          if old_a not in s or old_b not in s:
              raise SystemExit('expected issued quote fixture signatures not found')
          s=s.replace(old_a,new_a,1).replace(old_b,new_b,1)
          anchor="('b4100001-0000-0000-0000-000000000001','bbbbbbbb-0000-0000-0000-000000000001','b4000001-0000-0000-0000-000000000001','Service B',1,10000,10000,10000,10000,1) on conflict do nothing;\n"
          if anchor not in s:
              raise SystemExit('quote item anchor not found')
          s=s.replace(anchor,anchor+"update quotes set status='ISSUED', issued_at=now() where id in ('a4000001-0000-0000-0000-000000000001','b4000001-0000-0000-0000-000000000001');\n",1)
          p.write_text(s)
          PY
          git diff --check

      - name: Commit fixture repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARVENA_FINAL_VERIFICATION/tests/db/fixtures.sql
          git commit -m 'fix(test): seed quote items before issued-state immutability'
          git push origin HEAD:arvena-final-green
