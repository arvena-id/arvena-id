name: ARVENA Canonical Function Argument Repair

on:
  push:
    branches: [arvena-final-green]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arvena-final-green
          fetch-depth: 0

      - name: Repair proven PostgreSQL function argument rename defect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql')
          s = p.read_text()
          a = 'create or replace function app.can_view_customer(p_org uuid,p_customer uuid)'
          b = 'create or replace function app.can_view_job(p_org uuid,p_job uuid)'
          c = 'create or replace function app.worker_visit_context'
          if a not in s or b not in s or c not in s:
              raise SystemExit('expected function-redefinition signatures not found; refusing broad rewrite')
          start = s.index(a); end = s.index(b, start)
          block = s[start:end].replace('p_customer','p_id')
          s = s[:start] + block + s[end:]
          start = s.index(b); end = s.index(c, start)
          block = s[start:end].replace('p_job','p_id')
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          git diff --check
          sha256sum ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql

      - name: Commit canonical repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql
          git commit -m 'fix(db): preserve function argument names across canonical redefinitions'
          git push origin HEAD:arvena-final-green
