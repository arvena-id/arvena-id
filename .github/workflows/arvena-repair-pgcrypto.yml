name: ARVENA Pgcrypto Qualification Repair

on:
  push:
    branches: [arvena-final-green]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arvena-final-green
          fetch-depth: 0

      - name: Qualify pgcrypto functions for Supabase extension schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p1=Path('ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql')
          s1=p1.read_text()
          if 'select encode(digest(' not in s1:
              raise SystemExit('expected unqualified digest signature not found in 0001')
          s1=s1.replace('digest(','extensions.digest(')
          p1.write_text(s1)

          p3=Path('ARVENA_FINAL_VERIFICATION/supabase/migrations/0003_arvena_p2.sql')
          s3=p3.read_text()
          if 'gen_random_bytes(' not in s3 or 'digest(' not in s3:
              raise SystemExit('expected pgcrypto signatures not found in 0003')
          s3=s3.replace('digest(','extensions.digest(').replace('gen_random_bytes(','extensions.gen_random_bytes(')
          p3.write_text(s3)
          PY
          git diff --check
          sha256sum ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql
          sha256sum ARVENA_FINAL_VERIFICATION/supabase/migrations/0003_arvena_p2.sql

      - name: Commit canonical repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARVENA_FINAL_VERIFICATION/supabase/migrations/0001_arvena_canonical_baseline.sql ARVENA_FINAL_VERIFICATION/supabase/migrations/0003_arvena_p2.sql
          git commit -m 'fix(db): qualify pgcrypto functions for Supabase runtime'
          git push origin HEAD:arvena-final-green
